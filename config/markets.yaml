# VRBCA Market Configuration
# This file defines approved assets, venues, and market data sources for the agent

# Approved Trading Venues
venues:
  binance:
    name: "BINANCE"
    type: "centralized_exchange"
    is_active: true
    
    # Connection configuration
    connection:
      api_base_url: "https://fapi.binance.com"
      websocket_url: "wss://fstream.binance.com/ws"
      rate_limits:
        requests_per_second: 10
        orders_per_minute: 1200
    
    # Risk parameters
    risk_parameters:
      max_position_size_bps: 5000  # 50% of total capital
      max_leverage_bps: 20000      # 2x leverage
      counterparty_limit: 1000000_000000  # $1M
      min_liquidity: 100000_000000        # $100K
      max_slippage_bps: 100               # 1%
    
    # Supported assets
    supported_assets:
      - symbol: "ETHUSDT"
        asset_type: "perpetual"
        min_notional: 10_000000  # $10 minimum
        tick_size: 1000          # $0.001 price precision
        
      - symbol: "BTCUSDT" 
        asset_type: "perpetual"
        min_notional: 10_000000
        tick_size: 10000         # $0.01 price precision
    
    # Fee structure
    fees:
      maker_fee_bps: 2   # 0.02%
      taker_fee_bps: 4   # 0.04%
      funding_fee_bps: 0 # Variable funding
  
  uniswap:
    name: "UNISWAP"
    type: "decentralized_exchange"
    is_active: true
    
    # Connection configuration
    connection:
      chain_id: 1
      router_address: "0xE592427A0AEce92De3Edee1F18E0157C05861564"
      factory_address: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
      multicall_address: "0x5BA1e12693Dc8F9c48aAD8770482f4739bEeD696"
    
    # Risk parameters  
    risk_parameters:
      max_position_size_bps: 3000  # 30% of total capital
      max_leverage_bps: 10000      # 1x (no leverage)
      counterparty_limit: 18446744073709551615  # No counterparty risk
      min_liquidity: 50000_000000  # $50K minimum
      max_slippage_bps: 200        # 2%
    
    # Supported pools
    supported_pools:
      - pool_address: "0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"
        tokens: ["USDC", "WETH"]
        fee_tier: 500  # 0.05%
        
      - pool_address: "0xCBCdF9626bC03E24f779434178A73a0B4bad62eD"
        tokens: ["WBTC", "WETH"]  
        fee_tier: 3000 # 0.3%
    
    # Fee structure
    fees:
      swap_fee_bps: 30   # 0.3% (pool dependent)
      gas_cost_gwei: 50  # Expected gas cost

# Approved Assets
assets:
  ETH:
    symbol: "ETH"
    name: "Ethereum"
    decimals: 18
    
    # Asset type configurations
    spot:
      is_approved: true
      max_position_bps: 4000  # 40% of portfolio
      venues: ["uniswap"]
      
    perpetual:
      is_approved: true  
      max_position_bps: 4000
      venues: ["binance"]
      
    # Risk parameters
    risk_config:
      risk_multiplier: 10000      # 1.0x base risk
      daily_volatility_bps: 2000  # 20% daily volatility
      correlation_eth: 10000      # 100% correlation with itself
      correlation_btc: 7000       # 70% correlation with BTC
      
    # Price limits
    price_limits:
      min_price: 100_000000    # $100 minimum
      max_price: 50000_000000  # $50K maximum
      circuit_breaker_bps: 1000  # 10% price movement halt
  
  BTC:
    symbol: "BTC"  
    name: "Bitcoin"
    decimals: 8
    
    spot:
      is_approved: false  # Not currently supported
      max_position_bps: 0
      venues: []
      
    perpetual:
      is_approved: true
      max_position_bps: 3000  # 30% of portfolio
      venues: ["binance"]
      
    risk_config:
      risk_multiplier: 12000      # 1.2x higher risk
      daily_volatility_bps: 2500  # 25% daily volatility  
      correlation_eth: 7000       # 70% correlation with ETH
      correlation_btc: 10000      # 100% correlation with itself
      
    price_limits:
      min_price: 1000_000000     # $1K minimum
      max_price: 500000_000000   # $500K maximum
      circuit_breaker_bps: 1000  # 10% price movement halt

# Oracle Configuration
oracles:
  chainlink:
    network: "ethereum_mainnet"
    feeds:
      ETH_USD:
        address: "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419"
        decimals: 8
        heartbeat: 3600  # 1 hour
        deviation_threshold: 50  # 0.5%
        
      BTC_USD:
        address: "0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c"
        decimals: 8  
        heartbeat: 3600
        deviation_threshold: 50
        
  uniswap_v3:
    network: "ethereum_mainnet" 
    pools:
      ETH_USDC:
        pool_address: "0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"
        twap_period: 3600  # 1 hour TWAP
        
  binance_api:
    endpoints:
      ticker_24hr: "/fapi/v1/ticker/24hr"
      funding_rate: "/fapi/v1/fundingRate"
      klines: "/fapi/v1/klines"
      
    rate_limits:
      weight_per_minute: 6000
      requests_per_second: 10

# Liquidity Requirements
liquidity:
  minimum_requirements:
    # Minimum liquidity for each venue (USD)
    binance_min: 200000_000000    # $200K minimum
    uniswap_min: 100000_000000    # $100K minimum
    
    # Minimum bid-ask spread requirements (basis points)
    max_spread_bps: 50            # 0.5% max spread
    
    # Minimum depth requirements
    min_depth_bps: 100            # 1% market impact for $1M trade
    
  monitoring:
    # How often to check liquidity (seconds)
    check_interval: 300           # 5 minutes
    
    # Liquidity degradation thresholds
    warning_threshold: 0.5        # Warn at 50% of minimum
    halt_threshold: 0.25          # Halt at 25% of minimum

# Market Data Sources
market_data:
  primary_sources:
    spot_prices:
      - source: "chainlink"
        weight: 70
      - source: "uniswap_v3"
        weight: 30
        
    perpetual_prices:
      - source: "binance_api"
        weight: 100
        
    funding_rates:
      - source: "binance_api"
        weight: 100
        
  validation:
    # Maximum deviation between sources (basis points)
    max_deviation_bps: 500        # 5%
    
    # Maximum age for market data (seconds)
    max_staleness: 300            # 5 minutes
    
    # Minimum sources required
    min_sources: 2
    
  fallback_behavior:
    # What to do when primary sources fail
    use_last_valid_price: true
    max_last_price_age: 1800      # 30 minutes
    halt_on_total_failure: true

# Trading Sessions
trading_sessions:
  # When the agent is allowed to trade
  allowed_hours:
    # UTC hours when trading is permitted
    start_hour: 0    # 00:00 UTC
    end_hour: 24     # 24:00 UTC (always on)
    
    # Days of week (0 = Sunday, 6 = Saturday)
    allowed_days: [0, 1, 2, 3, 4, 5, 6]  # All days
    
  restricted_periods:
    # Periods when trading is restricted or halted
    - name: "Major Crypto Conference"
      start_date: "2024-04-01"
      end_date: "2024-04-03"
      reason: "Expected high volatility"
      
  maintenance_windows:
    # Scheduled maintenance for venues
    binance:
      - day: "Monday" 
        start_time: "08:00"
        end_time: "09:00"
        timezone: "UTC"
        
# Network Configuration  
networks:
  ethereum_mainnet:
    chain_id: 1
    rpc_urls:
      - "https://eth-mainnet.g.alchemy.com/v2/{api_key}"
      - "https://mainnet.infura.io/v3/{api_key}"
    block_time: 12  # seconds
    gas_price_oracle: "https://api.etherscan.io/api"
    
  base_mainnet:
    chain_id: 8453
    rpc_urls: 
      - "https://base-mainnet.g.alchemy.com/v2/{api_key}"
    block_time: 2
    
# Performance Benchmarks
benchmarks:
  # Reference indices for performance comparison
  funding_rate_benchmark:
    target_annual_return_bps: 1000    # 10% annual target
    max_tracking_error_bps: 200       # 2% tracking error
    
  market_neutral_benchmark:
    target_sharpe_ratio: 2000         # 2.0 Sharpe ratio
    max_correlation_with_eth: 1000    # 10% max correlation