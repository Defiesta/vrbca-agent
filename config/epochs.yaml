# VRBCA Epoch Configuration
# This file defines the proof generation and settlement cadence for the agent

# Epoch Timing Configuration
epoch_timing:
  # Base epoch duration (seconds)
  default_duration: 3600        # 1 hour epochs
  
  # Minimum epoch duration (seconds)
  min_duration: 1800           # 30 minutes minimum
  
  # Maximum epoch duration (seconds)
  max_duration: 86400          # 24 hours maximum
  
  # Grace period for late submissions (seconds)
  grace_period: 300            # 5 minutes
  
  # Time zones and scheduling
  timezone: "UTC"
  
  # Adaptive epoch sizing
  adaptive_sizing:
    enabled: true
    # Shorter epochs during high volatility
    high_volatility_duration: 1800    # 30 minutes
    volatility_threshold_bps: 3000    # 30% daily volatility
    
    # Longer epochs during quiet periods  
    low_volatility_duration: 7200     # 2 hours
    low_volatility_threshold_bps: 500 # 5% daily volatility

# Proof Generation Configuration
proof_generation:
  # Boundless Market configuration
  boundless:
    # Proof generation timeout (seconds)
    timeout: 300                # 5 minutes
    
    # Maximum retry attempts
    max_retries: 3
    
    # Retry backoff (seconds)
    retry_backoff: 30
    
    # Proof verification requirements
    verification:
      # Minimum proof verification time (seconds)
      min_verification_time: 30
      
      # Maximum verification time before timeout (seconds)
      max_verification_time: 180
      
      # Required confidence level for proofs
      min_confidence_level: 9500  # 95%
  
  # Guest program configuration
  guest_program:
    # Maximum execution time in zkVM (cycles)
    max_execution_cycles: 1000000
    
    # Memory limit for guest program (bytes)
    max_memory_usage: 33554432    # 32 MB
    
    # Input validation
    max_input_size: 1048576       # 1 MB
    min_input_size: 1024          # 1 KB
    
  # Proof storage and retrieval
  storage:
    # Where to store proof artifacts
    storage_provider: "ipfs"      # or "arweave", "s3"
    
    # Proof retention period (days)
    retention_days: 365
    
    # Backup storage locations
    backup_providers: ["arweave"]

# Settlement Configuration  
settlement:
  # On-chain settlement parameters
  blockchain:
    # Target block confirmation time (seconds)
    target_confirmation_time: 60
    
    # Maximum gas price for settlements (gwei)
    max_gas_price: 100
    
    # Gas limit for settlement transactions
    gas_limit: 500000
    
    # Transaction timeout (seconds)
    tx_timeout: 300
  
  # Batch settlement options
  batching:
    # Enable batch settlements for multiple epochs
    enabled: false
    
    # Maximum epochs per batch
    max_epochs_per_batch: 24
    
    # Minimum epochs before forced settlement
    min_batch_size: 6
    
    # Gas cost savings threshold to trigger batching
    min_gas_savings_bps: 200     # 2% gas savings
  
  # Settlement validation
  validation:
    # Validate state transitions
    verify_state_transitions: true
    
    # Check risk constraint compliance
    verify_risk_compliance: true
    
    # Validate execution reports
    verify_execution_reports: true
    
    # Cross-check with venue APIs
    cross_check_venues: true

# Epoch State Management
state_management:
  # State persistence
  persistence:
    # How often to persist state (seconds)
    persistence_interval: 60
    
    # State backup frequency (epochs)
    backup_frequency: 24
    
    # State compression
    compress_state: true
    
  # State validation
  validation:
    # Verify state integrity on load
    verify_integrity: true
    
    # Check state consistency across epochs
    verify_consistency: true
    
    # Validate state transitions
    verify_transitions: true
  
  # State recovery
  recovery:
    # Enable automatic state recovery
    auto_recovery: true
    
    # Maximum recovery attempts
    max_recovery_attempts: 5
    
    # Recovery timeout (seconds)
    recovery_timeout: 300

# Performance Monitoring
monitoring:
  # Epoch performance metrics
  performance_metrics:
    # Track proof generation time
    track_proof_time: true
    
    # Track settlement time
    track_settlement_time: true
    
    # Track gas costs
    track_gas_costs: true
    
    # Track success/failure rates
    track_success_rates: true
  
  # Performance thresholds
  thresholds:
    # Maximum acceptable proof time (seconds)
    max_proof_time: 300
    
    # Maximum acceptable settlement time (seconds)  
    max_settlement_time: 180
    
    # Maximum acceptable gas cost (gwei)
    max_gas_cost: 0.01 # ETH
    
    # Minimum success rate (basis points)
    min_success_rate_bps: 9800    # 98%
  
  # Alerting configuration
  alerts:
    # Alert on slow epochs
    slow_epoch_threshold: 600     # 10 minutes
    
    # Alert on failed epochs
    alert_on_failures: true
    
    # Alert destinations
    alert_channels: ["discord", "telegram", "email"]

# Debugging and Development
debugging:
  # Enable debug mode
  debug_mode: false
  
  # Verbose logging
  verbose_logging: false
  
  # Save intermediate artifacts
  save_artifacts: true
  
  # Proof verification in debug mode
  verify_proofs_locally: true
  
  # Test mode configuration
  test_mode:
    # Use mock data sources
    use_mock_data: false
    
    # Skip actual venue executions
    skip_executions: false
    
    # Use test networks
    use_testnets: false
    
    # Faster epoch timing for testing
    fast_epochs: false
    test_epoch_duration: 60      # 1 minute for testing

# Failure Handling
failure_handling:
  # Proof generation failures
  proof_failures:
    # Retry strategy
    retry_strategy: "exponential_backoff"
    
    # Fallback to previous epoch state
    fallback_to_previous: true
    
    # Emergency halt on repeated failures
    halt_threshold: 3            # 3 consecutive failures
    
  # Settlement failures
  settlement_failures:
    # Retry with higher gas price
    retry_higher_gas: true
    gas_price_multiplier: 1.5
    
    # Use alternative RPC endpoints
    use_backup_rpc: true
    
    # Emergency manual intervention threshold
    manual_intervention_threshold: 5
  
  # Network failures
  network_failures:
    # Timeout handling
    connection_timeout: 30       # seconds
    read_timeout: 60            # seconds
    
    # Retry configuration
    max_network_retries: 5
    network_retry_delay: 10     # seconds
    
    # Circuit breaker
    circuit_breaker:
      failure_threshold: 5      # failures before opening circuit
      recovery_timeout: 300     # seconds before attempting recovery
      half_open_max_calls: 3    # test calls during recovery

# Regulatory and Compliance
compliance:
  # Audit trail requirements
  audit_trail:
    # Log all epoch transitions
    log_transitions: true
    
    # Retain audit logs (days)
    retention_days: 2555         # 7 years
    
    # Digital signatures on proofs
    sign_proofs: true
    
  # Reporting requirements
  reporting:
    # Generate epoch reports
    generate_reports: true
    
    # Report frequency
    report_frequency: "daily"
    
    # Report destinations
    report_destinations: ["s3", "arweave"]
  
  # Risk monitoring compliance
  risk_compliance:
    # Real-time risk monitoring
    realtime_monitoring: true
    
    # Risk report generation
    generate_risk_reports: true
    
    # Regulatory notification thresholds
    notification_thresholds:
      leverage_breach_bps: 21000  # 2.1x leverage
      delta_breach_bps: 110       # 1.1% net delta
      drawdown_breach_bps: 2100   # 21% drawdown

# Resource Management
resources:
  # CPU and memory limits
  compute_limits:
    # Maximum CPU usage (percentage)
    max_cpu_usage: 80
    
    # Maximum memory usage (MB)
    max_memory_usage: 2048
    
    # Proof generation CPU priority
    proof_cpu_priority: "high"
  
  # Network bandwidth
  bandwidth_limits:
    # Maximum bandwidth usage (Mbps)
    max_bandwidth: 100
    
    # Rate limiting for API calls
    api_rate_limits:
      binance: 10      # requests per second
      chainlink: 5     # requests per second
      uniswap: 20      # requests per second
  
  # Storage limits
  storage_limits:
    # Maximum local storage (GB)
    max_local_storage: 10
    
    # Cleanup old data automatically
    auto_cleanup: true
    
    # Cleanup threshold (GB)
    cleanup_threshold: 8

# Emergency Procedures
emergency:
  # Emergency halt conditions
  halt_conditions:
    # Consecutive epoch failures
    consecutive_failures: 3
    
    # Proof verification failures  
    proof_verification_failures: 2
    
    # Settlement transaction failures
    settlement_failures: 5
    
    # Extreme market conditions
    extreme_volatility_bps: 5000  # 50% daily volatility
  
  # Emergency contacts and procedures
  emergency_response:
    # Automatic notifications
    auto_notify: true
    
    # Emergency contact methods
    contact_methods: ["discord", "telegram", "email", "sms"]
    
    # Manual intervention procedures
    manual_procedures:
      - "Check agent logs for error details"
      - "Verify network connectivity"
      - "Check venue API status"
      - "Review recent market conditions"
      - "Contact development team if needed"