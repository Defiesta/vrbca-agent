[package]
name = "vrbca-core"
version = "0.1.0"
edition = "2021"
description = "Core modules for VRBCA strategy, risk management, and state tracking"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

# Math and precision
rust_decimal = "1.32"

# Error handling  
anyhow = "1.0"
thiserror = "1.0"

# Optional features for different environments
[features]
default = ["std"]
std = []
zkvm = []