[workspace]

[package]
name = "vrbca"
version = "0.1.0"
edition = "2021"

[dependencies]
risc0-zkvm = { version = "3.0", default-features = false, features = ["std"] }
alloy-primitives = { version = "1.0", default-features = false, features = ["std"] }
alloy-sol-types = { version = "1.0", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }

[[bin]]
name = "vrbca"
path = "src/main.rs"